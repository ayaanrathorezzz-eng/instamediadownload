<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>IG Media Downloader</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">
        <span class="dot"></span>
        <span>IG Media</span>
      </div>

      <h1>Download public Instagram media.</h1>
      <p class="sub">Paste a public Instagram Reel, post, story or highlight URL.</p>

      <form id="form" autocomplete="off">
        <div class="input-row">
          <input id="url" type="url" inputmode="url"
                 placeholder="https://www.instagram.com/..."
                 maxlength="2048" required>
          <button id="submit" type="submit">Get media</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="result" class="result hidden">
        <div class="preview-wrap">
          <img id="thumb" alt="Media thumbnail" referrerpolicy="no-referrer">
          <video id="previewVideo" controls muted playsinline preload="metadata" hidden></video>
          <div id="noPreview" class="no-preview" hidden>Preview unavailable</div>
        </div>
        <div class="actions">
          <a id="videoBtn" class="btn primary" rel="noopener noreferrer" download>
            Download video
          </a>
          <a id="thumbBtn" class="btn secondary" rel="noopener noreferrer" download>
            Download thumbnail
          </a>
        </div>
      </section>

      <p class="note">
        Public/authorized content only. Private content and access-control bypassing are not supported.
      </p>
    </section>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
